name: CI

on:
  # Feature branches are checked through their PR, not once for push and again for the PR.
  push:
    branches: [main]
  pull_request:
  # A branch without a PR can still be checked explicitly from the Actions page.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# M7: CI is hermetic by DECLARATION, not by the accident of having no credentials. `local` forces
# the PGlite snapshot + the `.storage/` driver even if a DATABASE_URL ever reaches this runner, so
# no future secret can make CI read or write the live project. See lib/runtime-mode.ts.
env:
  PLAYBOOK_MODE: local

jobs:
  # A documentation edit cannot change what the suite asserts, and the suite costs ~32 billed
  # minutes a run. This gate decides once, cheaply, whether the rest of the workflow has anything
  # to do.
  #
  # The jobs below are SKIPPED by `if:`, never removed by `paths-ignore`. A workflow that does not
  # run reports no checks at all, which leaves a branch rule waiting for a status that will never
  # arrive; a job skipped by a condition still reports, and a required check counts a skip as a
  # pass. Every branch that cannot classify a change falls through to the full suite, so a filter
  # bug costs minutes rather than coverage.
  changes:
    name: changed paths
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - name: Decide whether this change can affect the suite
        id: filter
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          set -uo pipefail

          full() { echo "$1 — running the full suite"; echo "code=true" >> "$GITHUB_OUTPUT"; exit 0; }

          # The file list comes from the API rather than a checkout: this job exists to be cheap,
          # and cloning the tree to read its names would cost more than it saves.
          case "$EVENT" in
            pull_request)
              files=$(gh api --paginate "repos/$REPO/pulls/$PR/files" --jq '.[].filename') || full "cannot list PR files"
              ;;
            push)
              [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ] || full "no base commit"
              files=$(gh api "repos/$REPO/compare/$BEFORE...$AFTER" --jq '.files[].filename') || full "cannot compare commits"
              ;;
            *)
              full "$EVENT is not a change event"
              ;;
          esac

          [ -n "$files" ] || full "empty file list"
          echo "changed files:"; echo "$files" | sed 's/^/  /'

          code=false
          while IFS= read -r file; do
            [ -n "$file" ] || continue
            case "$file" in
              # Workflow edits must prove themselves by running.
              .github/*) code=true ;;
              docs/*|*.md) ;;
              *) code=true ;;
            esac
          done <<< "$files"

          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "verdict: code=$code"

  test_shards:
    name: tests (${{ matrix.shard }}/4)
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install (exact pins, lockfile authoritative)
        run: npm ci

      # Shard-independent checks run once. They were in every shard, which bought nothing: the
      # tree they read is identical in all four. Shard 1 carries them rather than a job of their
      # own, because a separate job pays a fresh checkout + install and another rounded-up
      # billing minute (GitHub bills each job to the whole minute) to save 23 seconds of work.
      # Keeping them ahead of the vitest step also preserves fail-fast: a type error stops
      # shard 1 in well under a minute instead of after the suite.
      - name: Typecheck
        if: ${{ matrix.shard == 1 }}
        run: npm run typecheck

      # Every file is assigned exactly once; all shards feed the existing required check below.
      - name: Vitest shard
        run: npx vitest run --shard=${{ matrix.shard }}/4

      - name: Private client import boundaries
        if: ${{ matrix.shard == 1 }}
        run: npm run security:client

  check:
    name: typecheck + tests
    needs: [changes, test_shards]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every shard to pass
        env:
          FILTER_RESULT: ${{ needs.changes.result }}
          CODE: ${{ needs.changes.outputs.code }}
          SHARD_RESULT: ${{ needs.test_shards.result }}
        run: |
          set -eu
          # The filter decides whether the shards had to run, so a broken filter is a failed
          # gate, not a free pass.
          test "$FILTER_RESULT" = success
          if [ "$CODE" != "true" ]; then
            echo "documentation-only change: no shard to wait for"
            exit 0
          fi
          test "$SHARD_RESULT" = success

  # PLAN §8 M2 — "Playwright authz sweep: zero gated bytes or storage keys for anon".
  # Implemented as a fetch-level sweep against a real `next start` (scripts/sweep-anon.ts): no
  # browser is needed to prove an absence in the HTML, and the assertion is stronger without one —
  # it reads the bytes on the wire rather than the DOM after hydration.
  sweep:
    name: anon authz sweep
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install (exact pins, lockfile authoritative)
        run: npm ci

      # The snapshot the server reads: real migrations + the real prepare → copy → publish flow,
      # including the draft / archived / superseded fixtures the sweep asserts refusals against.
      - name: Build the local catalog snapshot
        run: npm run db:local

      - name: Build
        run: npm run build

      - name: Public bundle recipe and source-map check
        run: npm run security:built

      # No wait-on / start-server-and-test: a curl loop needs no dependency the repo does not pin.
      - name: Start the server
        run: |
          npm start &
          echo $! > .server.pid
          for i in $(seq 1 60); do
            if curl -sf -o /dev/null http://localhost:3000/en; then
              echo "server up after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "server did not come up"; exit 1

      - name: Sweep (anonymous tier)
        run: npm run sweep:anon

      - name: Stop the server
        if: always()
        run: |
          if [ -f .server.pid ]; then
            kill "$(cat .server.pid)" || true
          fi
