name: CI

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: typecheck + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install (exact pins, lockfile authoritative)
        run: npm ci

      # Same command a developer runs locally: npm run check
      - name: Typecheck + vitest
        run: npm run check

      # The migrations/RPC/trigger suites run on PGlite — no Docker, no Supabase project needed.
      - name: Build
        run: npm run build
