<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link href="gf-local.css" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; background: #ffffff; overflow: hidden; }
  .frame {
    position: absolute; inset: 14px;
    border: 1px solid rgba(0, 0, 0, 0.16);
  }
  .card {
    position: relative; width: 1200px; height: 630px;
    padding: 58px 64px 48px;
    display: flex; flex-direction: column;
    color: #000;
  }
  .top {
    display: flex; align-items: center; justify-content: space-between;
  }
  .brand { display: flex; align-items: center; gap: 16px; }
  .twings { height: 40px; width: auto; display: block; }
  .wordmark {
    font-family: 'Big Shoulders', sans-serif; font-weight: 900;
    font-size: 30px; letter-spacing: 0.02em;
  }
  .eyebrow {
    font-family: 'Anton SC', sans-serif; font-size: 19px;
    letter-spacing: 0.14em; color: #0000EE;
  }
  .display {
    font-family: 'Big Shoulders', sans-serif; font-weight: 900;
    font-size: 126px; line-height: 0.88; letter-spacing: -0.015em;
    text-transform: uppercase; margin-top: 40px;
  }
  .display .accent { color: #0000EE; }
  .bottom {
    margin-top: auto;
    border-top: 1px solid rgba(0, 0, 0, 0.16);
    padding-top: 22px;
    display: flex; align-items: baseline; justify-content: space-between;
    font-family: 'Geist Mono', monospace; font-size: 21px; letter-spacing: 0.01em;
  }
  .bottom .url { font-weight: 500; }
  .bottom .note { color: rgba(0, 0, 0, 0.55); }
</style>
</head>
<body>
  <div class="frame"></div>
  <div class="card">
    <div class="top">
      <div class="brand">
        <svg class="twings" viewBox="0 0 960 250" xmlns="http://www.w3.org/2000/svg" aria-label="TWINGS">
          <g fill="none" stroke="#000000" stroke-width="46" stroke-linecap="round" stroke-linejoin="round">
            <path d="M40 54 H158"/><path d="M99 54 V196"/>
            <path d="M208 54 L242 196 L276 108 L310 196 L344 54"/>
            <path d="M396 54 V196"/>
            <path d="M448 196 V54 L542 196 V54"/>
            <path d="M692 86 A 64 71 0 1 0 692 164 L692 126 H648"/>
            <path d="M914 88 A 62 37 0 1 0 838 125 A 62 37 0 1 1 762 162"/>
          </g>
        </svg>
      </div>
      <div class="eyebrow">TWINGS STUDIO · SEEDANCE 2.5</div>
    </div>

    <div class="display">One photo<span class="accent">.</span><br>One film<span class="accent">.</span><br>You&rsquo;re in it<span class="accent">.</span></div>

    <div class="bottom">
      <span class="url">twings.app</span>
      <span class="note">ONE PHOTO IN — A FINISHED FILM OUT</span>
    </div>
  </div>
</body>
</html>
