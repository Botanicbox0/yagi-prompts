  <script>
    'use strict';
    // A standalone design artifact. No API calls, storage, notifications, payments or real identities.
    const $=(selector,root=document)=>root.querySelector(selector);
    const $$=(selector,root=document)=>Array.from(root.querySelectorAll(selector));
    const icon=(name)=>`<svg aria-hidden="true"><use href="#i-${name}"/></svg>`;
    const escapeHtml=(value)=>String(value).replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
    const menuGroups=[['업무',[['today','grid','오늘 할 일'],['campaign','campaign','캠페인'],['brands','brand','브랜드'],['creators','people','크리에이터']]],['운영',[['renders','loop','생성·환불'],['settlement','wallet','정산'],['support','chat','문의·신고']]],['시스템',[['templates','template','템플릿'],['notifications','bell','알림'],['permissions','lock','권한·기록']]]];
    const initialItems=[
      {id:'C-001',title:'새 제출물의 광고 표기를 확인해 주세요',campaign:'가상 캠페인 A',kind:'콘텐츠 검수',filter:'review',icon:'campaign',status:'검토 필요',time:'예시 · 2시간 전',detail:'제출한 링크와 캠페인 요구사항을 대조하는 작업입니다. 브랜드의 콘텐츠 승인과 스튜디오의 게시물 검수는 별도로 기록합니다.',checks:['게시 링크와 플랫폼 확인','광고 표기·필수 문구 확인','승인된 콘텐츠 버전과 일치하는지 확인']},
      {id:'R-002',title:'최종 생성 실패 후 환불 상태 확인',campaign:'가상 생성 주문',kind:'생성·환불',filter:'issue',icon:'loop',status:'확인 필요',time:'예시 · 3시간 전',detail:'자동 환불 요청 이후 결제사 응답을 확인하는 운영 상황의 예시입니다. 이 화면은 결제사에 연결하지 않으며 실제 취소를 요청하지 않습니다.',checks:['최종 실패 상태 확인','원 주문과 환불 요청 연결 확인','결제사 환불 완료 응답 확인']},
      {id:'V-003',title:'수정한 포맷을 브랜드에 확인 요청',campaign:'가상 캠페인 A · 포맷 v3',kind:'브랜드 확인',filter:'review',icon:'brand',status:'요청 대기',time:'예시 · 오늘',detail:'승인은 특정 버전에만 적용합니다. v2를 승인받았어도 수정한 v3에는 새 확인이 필요합니다. 확인 요청 시연은 로컬 기록만 추가합니다.',checks:['수정 내용과 이전 버전 비교','브랜드에 공유할 자료 범위 확인','승인 대상 버전 고정']},
      {id:'P-004',title:'정산 기준과 증빙을 확인해 주세요',campaign:'가상 캠페인 B · 제출물 C-004',kind:'정산',filter:'settlement',icon:'wallet',status:'정산 대상',time:'예시 · 오늘',detail:'검수 후 대기 기간이 끝난 항목의 예시입니다. 정산 대상이 된 상태와 실제 지급 완료 상태를 구분합니다. 금액과 계좌는 이 시안에 포함하지 않습니다.',checks:['검수일과 정산 가능일 확인','조회수 기준·측정 시각·근거 확인','이체 완료 증빙은 지급 후 별도 기록']},
      {id:'B-005',title:'새 브랜드 의뢰의 다음 단계 정하기',campaign:'가상 브랜드 의뢰',kind:'브랜드 문의',filter:'review',icon:'chat',status:'미확인',time:'예시 · 오늘',detail:'스튜디오가 목표와 제작 범위를 확인한 뒤 진행 방향을 안내합니다. 브랜드가 직접 캠페인을 생성하거나 운영하는 흐름은 포함하지 않습니다.',checks:['캠페인 목표와 희망 일정 확인','의뢰 내용의 누락 확인','담당자와 다음 연락 단계 지정']},
      {id:'C-006',title:'수정 후 다시 제출한 링크 검수',campaign:'가상 캠페인 B · 제출물 C-006',kind:'콘텐츠 검수',filter:'review',icon:'campaign',status:'재검토',time:'예시 · 오늘',detail:'이전 수정 요청과 현재 제출물을 함께 확인합니다. 수정 요청은 이유와 대상 버전을 남겨 크리에이터가 다음 행동을 알 수 있게 합니다.',checks:['이전 수정 요청 확인','다시 제출한 링크 열림 확인','수정 사항 반영 확인']}
    ];
    let items=initialItems.map(item=>({...item}));
    let view='today',filter='all',query='',prototypeState='normal',settlementTab='eligible',activeItem=null;
    let audit=[],version=3,approval='검토 대기',toastTimer;
    const initialVersionHistory=[
      {version:2,status:'승인됨',title:'브랜드 담당자가 v2를 확인함',description:'이 승인은 이후 버전에 적용되지 않습니다.'},
      {version:1,status:'수정 요청',title:'문구 길이와 로고 위치 수정',description:'변경 요청을 다음 버전에 반영했습니다.'}
    ];
    let versionHistory=initialVersionHistory.map(entry=>({...entry}));
    const returnFocus=new WeakMap();
    const titles={today:'오늘 할 일',campaign:'가상 캠페인 A',settlement:'정산'};
    const navMarkup=()=>menuGroups.map(([label,entries])=>`<div class="nav-group"><p class="nav-label">${label}</p>${entries.map(([key,glyph,title])=>`<button class="nav-button" data-view="${key}" ${view===key?'aria-current="page"':''}>${icon(glyph)}<span>${title}</span>${key==='today'?`<span class="count mono">${items.length}</span>`:''}</button>`).join('')}</div>`).join('');
    function renderNav(){ $('#desktop-nav').innerHTML=navMarkup();$('#mobile-all-nav').innerHTML=navMarkup();$$('.mobile-nav button').forEach(button=>button.getAttribute('data-view')===view?button.setAttribute('aria-current','page'):button.removeAttribute('aria-current')); }
    function controls(){return `<div class="prototype-controls"><span>시안 확인 도구</span><label>화면 상태 <select id="state-select"><option value="normal">기본</option><option value="empty">빈 상태</option><option value="loading">불러오는 중</option><option value="error">오류</option><option value="forbidden">권한 없음</option></select></label><button class="text-button" data-action="reset">예시 데이터 초기화</button><span>변경은 이 탭에서만 유지됩니다.</span></div>`}
    function heading(title,description,action=`<button class="button" data-action="audit">${icon('clock')}시연 기록 보기</button>`){return `<div class="page-heading"><div><h1>${title}</h1><p>${description}</p></div>${action}</div>`}
    function stateMarkup(){
      if(prototypeState==='normal')return '';
      if(prototypeState==='loading')return `<div role="status" aria-label="불러오는 중 시안"><p class="muted" style="font-size:11px;margin-bottom:12px">불러오는 중 · 실제 요청은 보내지 않습니다.</p>${[0,1,2,3].map(()=>'<div class="skeleton"><div class="loading-line" style="width:65%"></div><div class="loading-line" style="width:38%"></div></div>').join('')}</div>`;
      const states={empty:['check','지금 확인할 항목이 없어요','업무가 생기면 이곳에 다음 행동과 함께 표시합니다.'],error:['alert','목록을 불러오지 못했어요','이전에 처리한 내역은 그대로입니다. 다시 불러오는 동작을 시연할 수 있어요.'],forbidden:['lock','이 화면을 볼 권한이 없어요','담당 업무에 필요한 접근 권한을 스튜디오 관리자에게 요청해 주세요.']};
      const [glyph,title,description]=states[prototypeState];
      return `<div class="state-panel" role="status">${icon(glyph)}<h3>${title}</h3><p>${description}</p><button class="button" data-action="normal">${prototypeState==='error'?'다시 불러오기 시연':'기본 시안으로 돌아가기'}</button></div>`;
    }
    function contextRail(){return `<aside class="context-rail" aria-label="캠페인 운영 맥락"><section class="context-section"><h3>진행 중인 캠페인 <span class="muted mono">02</span></h3><button class="campaign-mini" data-view="campaign"><strong>가상 캠페인 A ${icon('arrow')}</strong><p>포맷 v${version} · 브랜드 ${approval}</p><div class="progress" aria-hidden="true"><i class="done"></i><i class="current"></i><i></i><i></i><i></i></div></button><button class="campaign-mini" data-action="campaign-b"><strong>가상 캠페인 B ${icon('arrow')}</strong><p>콘텐츠 검수 · 정산 준비</p><div class="progress" aria-hidden="true"><i class="done"></i><i class="done"></i><i class="done"></i><i class="current"></i><i></i></div></button></section><section class="context-section"><h3>누가 무엇을 하나요</h3><p class="context-note"><strong>스튜디오가 운영합니다.</strong>모집·선정·검수·정산을 맡습니다.<br><br><strong>브랜드는 확인하고 승인합니다.</strong>공유받은 버전과 진행 상황을 봅니다.</p></section><section class="context-section"><h3>최근 시연 기록</h3><ul class="activity">${audit.length?audit.slice(-3).reverse().map(event=>`<li>${escapeHtml(event.text)}<time>${event.time} · 이 탭의 예시 기록</time></li>`).join(''):'<li>아직 시연한 동작이 없습니다.<time>작업을 열어 검토 흐름을 확인하세요.</time></li>'}</ul></section></aside>`}
    function todayMarkup(){return `${heading('오늘 할 일','확인이 필요한 순서대로, 한 곳에서 이어서 처리하세요.')}<div class="stats"><div class="stat"><span class="stat-label">확인할 업무 · 예시</span><strong class="mono">${items.length.toString().padStart(2,'0')}</strong><small>전체 대기</small></div><div class="stat"><span class="stat-label">브랜드 확인 · 예시</span><strong class="mono blue">01</strong><small>포맷 v${version}</small></div><div class="stat"><span class="stat-label">정산 대상 · 예시</span><strong class="mono">02</strong><small>지급 전</small></div></div><div class="content-grid"><section aria-labelledby="queue-title"><div class="section-title"><h2 id="queue-title">확인이 필요한 업무</h2><small>모든 항목은 가상 데이터</small></div><div class="toolbar"><div class="filter-group" aria-label="업무 유형">${[['all','전체'],['review','검토·확인'],['issue','생성·환불'],['settlement','정산']].map(([id,label])=>`<button class="filter-button" data-filter="${id}" aria-pressed="${filter===id}">${label}</button>`).join('')}</div><label class="search">${icon('search')}<span class="sr-only">캠페인 또는 업무 검색</span><input id="queue-search" type="search" placeholder="캠페인 또는 업무 검색" value="${escapeHtml(query)}"></label></div><div id="queue-content"></div><p class="queue-foot">우선순위는 시안용입니다. 실제 기한·담당자·정책에 따른 정렬은 구현 단계에서 연결합니다.</p></section>${contextRail()}</div>${controls()}`}
    function renderQueue(){
      const target=$('#queue-content');if(!target)return;
      if(prototypeState!=='normal'){target.innerHTML=stateMarkup();return;}
      const matching=items.filter(item=>(filter==='all'||item.filter===filter)&&`${item.title} ${item.campaign} ${item.id}`.toLocaleLowerCase('ko').includes(query.toLocaleLowerCase('ko')));
      target.innerHTML=matching.length?`<div class="queue-head" aria-hidden="true"><span>업무 / 캠페인</span><span>현재 상태</span><span>등록 시점</span></div><div class="queue-list">${matching.map(item=>`<button class="queue-row ${activeItem===item.id?'selected':''}" data-item="${item.id}" aria-label="${escapeHtml(item.title)} — ${escapeHtml(item.campaign)} — ${item.status}"><span class="row-main"><span class="row-icon">${icon(item.icon)}</span><span><span class="row-title">${item.title}</span><span class="row-caption">${item.campaign} <span aria-hidden="true">·</span> ${item.id}</span></span></span><span class="badge ${item.id==='R-002'?'attention':''}">${item.status}</span><span class="row-meta">${item.time}</span></button>`).join('')}</div>`:`<div class="state-panel">${icon('search')}<h3>${items.length?'검색 조건에 맞는 업무가 없어요':'예시 업무를 모두 확인했어요'}</h3><p>${items.length?'다른 검색어나 업무 유형으로 찾아보세요.':'시안 확인 도구에서 예시 데이터를 초기화할 수 있어요.'}</p><button class="button" data-action="clear-filter">검색 조건 지우기</button></div>`;
    }

      if(action==='request-change'){const input=$('#brand-feedback');const value=input.value.trim();if(!value){$('#feedback-error').hidden=false;input.setAttribute('aria-invalid','true');input.setAttribute('aria-describedby','feedback-error');input.focus();return;}approval='수정 요청';record(`브랜드 역할 시연: 포맷 v${version} 수정 요청 · ${value}`);closeDialog($('#info-dialog'));render();notify('수정 요청 흐름을 시연했습니다. 실제 메시지는 발송하지 않았습니다.');}
    });
    document.addEventListener('input',event=>{if(event.target.id==='queue-search'){query=event.target.value;renderQueue();}if(event.target.id==='brand-feedback'){event.target.removeAttribute('aria-invalid');$('#feedback-error').hidden=true;}});
    document.addEventListener('change',event=>{if(event.target.id==='state-select'){prototypeState=event.target.value;render();$('#state-select').focus();}});
    document.addEventListener('keydown',event=>{
      if(event.target.matches('[role="tab"]')&&['ArrowLeft','ArrowRight','Home','End'].includes(event.key)){event.preventDefault();const tabs=['eligible','waiting','paid'];const index=tabs.indexOf(settlementTab);settlementTab=event.key==='Home'?tabs[0]:event.key==='End'?tabs[2]:tabs[(index+(event.key==='ArrowRight'?1:-1)+3)%3];render();$(`#tab-${settlementTab}`).focus();}
    });
    $$('dialog').forEach(dialog=>{
      dialog.addEventListener('close',()=>{
        const previous=returnFocus.get(dialog);
        if(dialog.id==='detail-dialog'){activeItem=null;renderQueue();}
        // List rendering replaces its buttons; restore the same task when it still exists.
        const replacement=previous?.dataset?.item?$(`[data-item="${previous.dataset.item}"]`):null;
        if(previous?.isConnected)previous.focus();else if(replacement)replacement.focus();else if(!$$('dialog').some(open=>open.open))$('#content').focus();
      });
      dialog.addEventListener('click',event=>{if(event.target===dialog){const bounds=dialog.getBoundingClientRect();if(event.clientX<bounds.left||event.clientX>bounds.right||event.clientY<bounds.top||event.clientY>bounds.bottom)dialog.close();}});
    });
    render();
  </script>
</body>
</html>
