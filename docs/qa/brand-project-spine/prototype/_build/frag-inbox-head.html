<header class="brc-inbox-head"><h1>알림함</h1><div role="group" aria-label="알림함" style="display:flex;gap:4px;margin-top:8px;padding:3px;border-radius:999px;background:var(--ys-raised, rgba(15, 23, 42, 0.05))"><button type="button" data-inbox-filter="all" aria-pressed="true" style="flex:1;border:0;border-radius:999px;padding:5px 10px;font-size:12px;font-weight:600;cursor:pointer;background:var(--ys-active-bg, #ededed);color:var(--ys-active-fg, #09090b)">전체</button><button type="button" data-inbox-filter="action" aria-pressed="false" style="flex:1;border:0;border-radius:999px;padding:5px 10px;font-size:12px;font-weight:500;cursor:pointer;background:transparent;color:var(--ys-ink-secondary)">확인 필요</button><button type="button" data-inbox-filter="conversations" aria-pressed="false" style="flex:1;border:0;border-radius:999px;padding:5px 10px;font-size:12px;font-weight:500;cursor:pointer;background:transparent;color:var(--ys-ink-secondary)">대화</button></div></header>
