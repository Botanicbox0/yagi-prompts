<dialog class="brh-dialog" aria-labelledby="_R_0_-title" data-share-dialog="true"><div class="brh-head"><h2 id="_R_0_-title" class="brh-title">Share with a link</h2><button type="button" class="brh-close" aria-label="Close"><svg class="brh-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M6 6l12 12M18 6L6 18"></path></svg></button></div><p class="brh-lede">Anyone with the link can watch without signing in. They see this one piece and nothing else.</p><form class="brh-form" data-share-form="true"><label class="brh-check"><input type="checkbox" data-share-comments="true" checked=""/><span>Let them leave notes with their name</span></label><label class="brh-check"><input type="checkbox" data-share-download="true"/><span>Let them download the original</span></label><div class="brh-row"><label class="brh-field"><span>Link works for</span><select data-share-expiry="true"><option value="1">1 day</option><option value="7">7 days</option><option value="14" selected="">14 days</option><option value="30">30 days</option><option value="90">90 days</option></select></label><label class="brh-field"><span>Passphrase (optional)</span><input type="password" autoComplete="new-password" maxLength="64" aria-describedby="_R_0_-pass-hint" data-share-passphrase="true" value=""/></label></div><p class="brh-hint" id="_R_0_-pass-hint">At least 4 characters. Only people who know it can open the link.</p><div class="brh-actions"><button type="submit" class="brh-primary" data-share-create="true">Create link</button></div></form><p class="brh-error" role="alert"></p><section class="brh-list" aria-labelledby="_R_0_-list"><h3 id="_R_0_-list" class="brh-subtitle">Links you made</h3></section></dialog>
