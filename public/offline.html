<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>TWINGS — 오프라인</title>
    <style>
      html, body { margin: 0; min-height: 100%; background: #fff; color: #0a0a0a; font-family: system-ui, -apple-system, 'Pretendard', sans-serif; }
      main { max-width: 32rem; margin: 0 auto; padding: 22vh 1.5rem 4rem; }
      p.eyebrow { font-size: 0.7rem; letter-spacing: 0.14em; text-transform: uppercase; color: #0000ee; margin: 0 0 1.25rem; }
      h1 { font-size: clamp(2rem, 8vw, 3rem); line-height: 0.95; font-weight: 900; text-transform: uppercase; margin: 0; }
      p.body { margin: 1.5rem 0 0; font-size: 1rem; line-height: 1.6; opacity: 0.7; }
      a { display: inline-block; margin-top: 2rem; padding: 0.8rem 1.4rem; border: 1px solid currentColor; text-decoration: none; color: inherit; font-size: 0.75rem; letter-spacing: 0.12em; text-transform: uppercase; }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow">TWINGS</p>
      <h1>지금은<br />오프라인입니다.</h1>
      <p class="body">연결이 돌아오면 템플릿과 캠페인이 그대로 있습니다. 다시 시도해 주세요.</p>
      <a href="/">다시 열기</a>
    </main>
  </body>
</html>
